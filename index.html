<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Calculator</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        width: 350px;
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      label {
        font-size: 18px;
        font-weight: bold;
      }

      input {
        width: 120px;
        padding: 8px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      #result {
        margin-top: 20px;
        padding: 15px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        background: #eaf7ea;
        border-radius: 8px;
        color: #1d6b1d;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Coin Calculator</h1>

      <div class="row">
        <label for="point5">$0.05</label>
        <input type="number" id="point5" value="0" min="0" />
      </div>

      <div class="row">
        <label for="point10">$0.10</label>
        <input type="number" id="point10" value="0" min="0" />
      </div>

      <div class="row">
        <label for="point25">$0.25</label>
        <input type="number" id="point25" value="0" min="0" />
      </div>

      <div class="row">
        <label for="oneDollar">$1.00</label>
        <input type="number" id="oneDollar" value="0" min="0" />
      </div>

      <div class="row">
        <label for="twoDollar">$2.00</label>
        <input type="number" id="twoDollar" value="0" min="0" />
      </div>

      <div id="result">Total: $0.00</div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
